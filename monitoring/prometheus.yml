global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/relaycore.rules.yml

scrape_configs:
  - job_name: relaycore
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/relaycore-metrics-token
    static_configs:
      - targets: [api:8000]
        labels:
          workspace: replace-with-workspace-name
