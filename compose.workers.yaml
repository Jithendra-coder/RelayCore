services:
  api:
    environment:
      RELAYCORE_WORKERS: "0"

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://relaycore:relaycore-local-change-me@db:5432/relaycore}
      RELAYCORE_DEMO_MODE: ${RELAYCORE_DEMO_MODE:-1}
      RELAYCORE_LEASE_SECONDS: ${RELAYCORE_LEASE_SECONDS:-4}
      RELAYCORE_SECRET_ENCRYPTION_KEY: ${RELAYCORE_SECRET_ENCRYPTION_KEY-}
      RELAYCORE_HTTP_ALLOWED_HOSTS: ${RELAYCORE_HTTP_ALLOWED_HOSTS-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_healthy; assert worker_is_healthy()"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
