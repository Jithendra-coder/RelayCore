services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: relaycore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaycore-local-change-me}
      POSTGRES_DB: relaycore
    volumes:
      - relaycore_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaycore -d relaycore"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://relaycore:relaycore-local-change-me@db:5432/relaycore}
      RELAYCORE_API_KEYS: ${RELAYCORE_API_KEYS-}
      RELAYCORE_DEMO_MODE: ${RELAYCORE_DEMO_MODE:-1}
      RELAYCORE_WORKERS: ${RELAYCORE_WORKERS:-2}
      RELAYCORE_MAX_ATTEMPTS: ${RELAYCORE_MAX_ATTEMPTS:-3}
      RELAYCORE_QUEUE_LIMIT: ${RELAYCORE_QUEUE_LIMIT:-1000}
      RELAYCORE_RATE_LIMIT_PER_MINUTE: ${RELAYCORE_RATE_LIMIT_PER_MINUTE:-600}
      RELAYCORE_LEASE_SECONDS: ${RELAYCORE_LEASE_SECONDS:-4}
      RELAYCORE_OIDC_ISSUER: ${RELAYCORE_OIDC_ISSUER-}
      RELAYCORE_OIDC_CLIENT_ID: ${RELAYCORE_OIDC_CLIENT_ID-}
      RELAYCORE_OIDC_CLIENT_SECRET: ${RELAYCORE_OIDC_CLIENT_SECRET-}
      RELAYCORE_OIDC_REDIRECT_URI: ${RELAYCORE_OIDC_REDIRECT_URI-}
      RELAYCORE_OIDC_STATE_SECRET: ${RELAYCORE_OIDC_STATE_SECRET-}
      RELAYCORE_OIDC_DISCOVERY_URL: ${RELAYCORE_OIDC_DISCOVERY_URL-}
      RELAYCORE_AUTH_SESSION_SECONDS: ${RELAYCORE_AUTH_SESSION_SECONDS:-43200}
      RELAYCORE_SECRET_ENCRYPTION_KEY: ${RELAYCORE_SECRET_ENCRYPTION_KEY-}
      RELAYCORE_HTTP_ALLOWED_HOSTS: ${RELAYCORE_HTTP_ALLOWED_HOSTS-}
      RELAYCORE_GITHUB_APP_SLUG: ${RELAYCORE_GITHUB_APP_SLUG-}
      RELAYCORE_GITHUB_APP_ID: ${RELAYCORE_GITHUB_APP_ID-}
      RELAYCORE_GITHUB_CLIENT_ID: ${RELAYCORE_GITHUB_CLIENT_ID-}
      RELAYCORE_GITHUB_CLIENT_SECRET: ${RELAYCORE_GITHUB_CLIENT_SECRET-}
      RELAYCORE_GITHUB_PRIVATE_KEY_B64: ${RELAYCORE_GITHUB_PRIVATE_KEY_B64-}
      RELAYCORE_GITHUB_WEBHOOK_SECRET: ${RELAYCORE_GITHUB_WEBHOOK_SECRET-}
      RELAYCORE_GITHUB_SETUP_URL: ${RELAYCORE_GITHUB_SETUP_URL-}
      RELAYCORE_GITHUB_CALLBACK_URL: ${RELAYCORE_GITHUB_CALLBACK_URL-}
      RELAYCORE_SLACK_CLIENT_ID: ${RELAYCORE_SLACK_CLIENT_ID-}
      RELAYCORE_SLACK_CLIENT_SECRET: ${RELAYCORE_SLACK_CLIENT_SECRET-}
      RELAYCORE_SLACK_APP_ID: ${RELAYCORE_SLACK_APP_ID-}
      RELAYCORE_SLACK_SIGNING_SECRET: ${RELAYCORE_SLACK_SIGNING_SECRET-}
      RELAYCORE_SLACK_CALLBACK_URL: ${RELAYCORE_SLACK_CALLBACK_URL-}
    ports:
      - "127.0.0.1:${RELAYCORE_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  relaycore_data:
