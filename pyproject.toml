[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "relaycore-sdk"
version = "0.1.0"
description = "Typed Python client and command-line interface for RelayCore."
license = "MIT"
requires-python = ">=3.12"

[project.scripts]
relaycore = "relaycore_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.setuptools.package-data]
relaycore_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["sdk"]

[tool.mypy]
python_version = "3.13"
platform = "linux"
files = ["app", "sdk"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
