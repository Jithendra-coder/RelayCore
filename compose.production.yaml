x-runtime-environment: &runtime-environment
  DATABASE_URL: ${DATABASE_URL:?Set a managed PostgreSQL URL with sslmode=verify-full}
  RELAYCORE_DEMO_MODE: "0"
  RELAYCORE_LEASE_SECONDS: ${RELAYCORE_LEASE_SECONDS:-4}
  RELAYCORE_SECRET_ENCRYPTION_KEY: ${RELAYCORE_SECRET_ENCRYPTION_KEY:?Set a Fernet key from your secret manager}
  RELAYCORE_HTTP_ALLOWED_HOSTS: ${RELAYCORE_HTTP_ALLOWED_HOSTS:-}
  RELAYCORE_AUTH_SESSION_SECONDS: ${RELAYCORE_AUTH_SESSION_SECONDS:-43200}

x-github-environment: &github-environment
  RELAYCORE_GITHUB_APP_SLUG: ${RELAYCORE_GITHUB_APP_SLUG:-}
  RELAYCORE_GITHUB_APP_ID: ${RELAYCORE_GITHUB_APP_ID:-}
  RELAYCORE_GITHUB_CLIENT_ID: ${RELAYCORE_GITHUB_CLIENT_ID:-}
  RELAYCORE_GITHUB_CLIENT_SECRET: ${RELAYCORE_GITHUB_CLIENT_SECRET:-}
  RELAYCORE_GITHUB_PRIVATE_KEY_B64: ${RELAYCORE_GITHUB_PRIVATE_KEY_B64:-}
  RELAYCORE_GITHUB_WEBHOOK_SECRET: ${RELAYCORE_GITHUB_WEBHOOK_SECRET:-}
  RELAYCORE_GITHUB_SETUP_URL: ${RELAYCORE_GITHUB_SETUP_URL:-}
  RELAYCORE_GITHUB_CALLBACK_URL: ${RELAYCORE_GITHUB_CALLBACK_URL:-}

services:
  api:
    image: ${RELAYCORE_IMAGE:?Set RELAYCORE_IMAGE to an immutable image reference}
    environment:
      <<: [*runtime-environment, *github-environment]
      RELAYCORE_WORKERS: "0"
      RELAYCORE_OIDC_ISSUER: ${RELAYCORE_OIDC_ISSUER:?Set the HTTPS OIDC issuer}
      RELAYCORE_OIDC_CLIENT_ID: ${RELAYCORE_OIDC_CLIENT_ID:?Set the OIDC client ID}
      RELAYCORE_OIDC_CLIENT_SECRET: ${RELAYCORE_OIDC_CLIENT_SECRET:?Set the OIDC client secret}
      RELAYCORE_OIDC_REDIRECT_URI: ${RELAYCORE_OIDC_REDIRECT_URI:?Set the HTTPS /auth/callback URI}
      RELAYCORE_OIDC_STATE_SECRET: ${RELAYCORE_OIDC_STATE_SECRET:?Set a random OIDC state secret}
      RELAYCORE_OIDC_DISCOVERY_URL: ${RELAYCORE_OIDC_DISCOVERY_URL:-${RELAYCORE_OIDC_ISSUER}/.well-known/openid-configuration}
      RELAYCORE_SLACK_CLIENT_ID: ${RELAYCORE_SLACK_CLIENT_ID:-}
      RELAYCORE_SLACK_CLIENT_SECRET: ${RELAYCORE_SLACK_CLIENT_SECRET:-}
      RELAYCORE_SLACK_APP_ID: ${RELAYCORE_SLACK_APP_ID:-}
      RELAYCORE_SLACK_SIGNING_SECRET: ${RELAYCORE_SLACK_SIGNING_SECRET:-}
      RELAYCORE_SLACK_CALLBACK_URL: ${RELAYCORE_SLACK_CALLBACK_URL:-}
    ports:
      - "127.0.0.1:${RELAYCORE_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6

  worker:
    image: ${RELAYCORE_IMAGE:?Set RELAYCORE_IMAGE to an immutable image reference}
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: [*runtime-environment, *github-environment]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_healthy; assert worker_is_healthy()"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
