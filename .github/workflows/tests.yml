name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: relaycore --help
      - run: python -m ruff check app tests benchmarks scripts sdk
      - run: python -m pre_commit run --all-files
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -q
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.workers.yaml config --quiet
      - name: Smoke test separate API and worker containers
        run: python -m scripts.compose_smoke
      - name: Validate Prometheus rules and config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.14.0 check rules /etc/prometheus/relaycore.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.14.0 check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.14.0 test rules /etc/prometheus/relaycore.rules.test.yml
  backup-restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/relaycore_restore_source
      RELAYCORE_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/relaycore_restore_target
      RELAYCORE_RESTORE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RELAYCORE_RESTORE_DRILL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.restore_drill
