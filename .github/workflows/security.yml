name: dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-dev.txt
